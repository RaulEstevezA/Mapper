[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mapper"
version = "0.1.1"
description = "Desktop tool that relates two data models, suggests the field mapping and generates the mapping code, locally."
readme = "README_en.md"
license = "MIT"
authors = [{ name = "Raul Estevez" }]
requires-python = ">=3.11"
# PyYAML reads YAML inputs, as the yaml package does in the web version
dependencies = ["PySide6>=6.10", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.17"]
# Packaging the app (packaging/mapper.spec); Pillow only regenerates the icons
build = ["pyinstaller>=6.22", "pillow>=11.0"]

[project.scripts]
mapper = "mapper.__main__:main"

[tool.setuptools.packages.find]
include = ["mapper*"]

[tool.setuptools.package-data]
mapper = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
