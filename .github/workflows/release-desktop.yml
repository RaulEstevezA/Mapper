# Compila la versión de escritorio para Windows, macOS y Linux con PyInstaller.
# Windows y Linux tienen dos versiones: x64 y ARM64.
#
# - Ejecución manual (Actions → Release desktop → Run workflow): compila todos los
#   sistemas y deja los archivos como artefactos del workflow, sin publicar nada.
# - Etiqueta v* (git tag v0.1.0 && git push origin v0.1.0): además crea la release
#   de GitHub con todos los archivos. La etiqueta tiene que coincidir con la versión
#   de desktop/pyproject.toml.
#
# Los nombres de los archivos no llevan versión, así que
# https://github.com/RaulEstevezA/Mapper/releases/latest/download/<archivo>
# siempre apunta a la última release (el botón de descarga de la web usa esas URLs).
#
# Las aplicaciones no están firmadas: macOS y Windows avisan la primera vez que se abren.

name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Mapper-Windows.zip
          - os: windows-11-arm
            asset: Mapper-Windows-ARM64.zip
          # Apple Silicon. Los Mac Intel necesitarían otro build en un runner Intel.
          - os: macos-latest
            asset: Mapper-macOS.dmg
          # La versión más antigua disponible: el ejecutable funciona en sistemas con
          # una glibc igual o más nueva que la del sistema donde se compila.
          - os: ubuntu-22.04
            asset: Mapper-Linux.tar.gz
          # PySide6 para ARM64 solo se publica para glibc 2.39 o más nueva (Ubuntu 24.04)
          - os: ubuntu-24.04-arm
            asset: Mapper-Linux-ARM64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión de pyproject.toml (${version})."
            exit 1
          fi

      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: pip install ".[dev,build]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm packaging/mapper.spec

      - name: Smoke test
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            Windows) dist/Mapper/Mapper.exe --smoke-test ;;
            macOS) dist/Mapper.app/Contents/MacOS/Mapper --smoke-test ;;
            Linux) dist/Mapper/Mapper --smoke-test ;;
          esac

      - name: Package
        run: |
          case "$RUNNER_OS" in
            Windows)
              pwsh -Command "Compress-Archive -Path dist/Mapper -DestinationPath '${{ matrix.asset }}'"
              ;;
            macOS)
              # Disk image with the app and a shortcut to Applications to drag it into
              mkdir dmg
              cp -R dist/Mapper.app dmg/
              ln -s /Applications dmg/Applications
              hdiutil create -volname Mapper -srcfolder dmg -format UDZO -ov "${{ matrix.asset }}"
              ;;
            Linux)
              tar -czf "${{ matrix.asset }}" -C dist Mapper
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: desktop/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mapper $GITHUB_REF_NAME" \
            --generate-notes
