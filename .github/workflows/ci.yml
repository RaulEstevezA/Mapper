# Comprueba cada cambio: tipos, lint, formato, tests y build de la versión web, y lint, formato y tests
# de la versión de escritorio.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Los tests compilan el código generado con python3, javac, dart, swiftc, rustfmt y php cuando están
      # instalados; en el runner se omiten los que no lo están y quedan las comprobaciones de instantáneas
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Los mismos casos de shared/test-cases/ que la versión web, y la ventana sin abrirla
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
